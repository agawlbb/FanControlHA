name: Integration checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography aiohttp probatio voluptuous pytest pytest-asyncio
      - run: python -m pytest -q
      - run: python -m compileall -q custom_components
  home-assistant-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install patched HA test harness
        run: |
          python -m pip install uv==0.13.4
          uv pip install --system --override scripts/ha-test-overrides.txt homeassistant==2026.10.2
      - run: python scripts/check_test_dependencies.py
      - run: python scripts/runtime_check.py
