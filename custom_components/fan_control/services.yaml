set_active_device:
  name: Set active watch device
  description: Changes the tile device on the watch's next visible refresh. The device must already be approved for that watch.
  fields:
    watch_id:
      name: Watch ID
      description: Full watch ID shown in the watch app's connection status.
      required: true
      selector:
        text:
    entity_id:
      name: Device
      required: true
      selector:
        entity:
          domain:
            - fan
            - light
            - switch
            - input_boolean
            - script
            - scene

set_active_panel:
  name: Set active watch panel
  description: Selects a configured panel on the next visible refresh. Use devices to return to the active device controls.
  fields:
    watch_id:
      name: Watch ID
      required: true
      selector:
        text:
    panel_id:
      name: Panel ID
      description: The configured panel ID, such as work_morning, or devices.
      required: true
      selector:
        text:
